server:
  port: 8080

# Configuración de logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.netflix.eureka: DEBUG
    bo.edu.ucb.microservices: DEBUG

# Configuración de Spring Cloud Gateway
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Ruta para ms-book
        - id: ms-book-route
          uri: lb://ms-book
          predicates:
            - Path=/api/books/**
          filters:
            - name: Retry
              args:
                retries: 3
                methods: GET,POST,PUT,DELETE
        # Ruta para catálogo de libros
        - id: book-catalog-route
          uri: lb://ms-book
          predicates:
            - Path=/v1/catalog/**
        # Ruta para health check de ms-book
        - id: ms-book-health
          uri: lb://ms-book
          predicates:
            - Path=/health
        # Ruta para actuator endpoints
        - id: ms-book-actuator
          uri: lb://ms-book
          predicates:
            - Path=/actuator/**
      # Configuración global de CORS
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allow-credentials: true

# Configuración de gestión y monitoreo
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  info:
    env:
      enabled: true

# Variables de configuración
app:
  eureka-server: localhost
  name: "Gateway de Microservicios"
  version: "1.0.0"
  description: "Gateway principal para enrutamiento de microservicios"

# Configuración de Eureka
eureka:
  client:
    serviceUrl:
      defaultZone: http://${app.eureka-server}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 5