spring:
  application:
    name: gateway
  cloud:
    config:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        # Ruta simple para books
        - id: books-route
          uri: http://ms-book:8082
          predicates:
            - Path=/api/books
          filters:
            - SetPath=/ms-book/v1/api/books
        # Exponer completamente los endpoints de ms-book (Swagger incluido)
        - id: ms-book-direct
          uri: http://ms-book:8082
          predicates:
            - Path=/ms-book/**
          filters:
            - StripPrefix=1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Deshabilitar Eureka completamente para evitar conflicts  
eureka:
  client:
    enabled: false

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.config: DEBUG
# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: gateway
        url: /v3/api-docs
      - name: ms-book
        url: /ms-book/v3/api-docs
  group-configs:
    - group: gateway
      paths-to-match: /actuator/**, /api/info/**
    - group: ms-book
      paths-to-match: /api/books/**, /api/search/**, /api/authors/**, /api/available/**, /api/statistics/**, /api/popular/**
