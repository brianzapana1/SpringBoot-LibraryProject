server:
  port: 8081

spring:
  application:
    name: gateway
  config:
    import: "optional:configserver:http://config-server:8888"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: ms-book
          uri: lb://ms-book
          predicates:
            - Path=/ms-book/**
          filters:
            - StripPrefix=1
        - id: config-server
          uri: lb://config-server
          predicates:
            - Path=/config/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=Authorization, Basic Y29uZmlnOmNoYW5nZV9tZQ==

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  eureka-server: discovery-server

eureka:
  client:
    serviceUrl:
      defaultZone: http://${app.eureka-server}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true