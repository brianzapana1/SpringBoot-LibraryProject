spring:
  application:
    name: ms-config-server
  cloud:
    config:
      server:
        git:
          uri: file:///app/config-repo
          default-label: master
          clone-on-start: false
          force-pull: false
          search-paths: '{application}'
          basedir: /tmp/config-repo
          skip-ssl-validation: true
          strict-host-key-checking: false
      label: master
  security:
    user:
      name: config
      password: config123

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,encrypt,decrypt
      base-path: /actuator
  endpoint:
    encrypt:
      enabled: true
    decrypt:
      enabled: true
  security:
    enabled: false

# Clave de encriptación
# Se puede configurar como variable de entorno ENCRYPT_KEY o aquí como fallback
encrypt:
  key: ${ENCRYPT_KEY:mi-clave-secreta-12345-para-encriptacion-spring-cloud-config}

logging:
  level:
    root: INFO
    org.springframework.cloud.config: DEBUG
    org.springframework.cloud.config.server: DEBUG
    org.eclipse.jgit: DEBUG

