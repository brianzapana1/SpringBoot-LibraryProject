spring:
  config:
    import: "optional:configserver:http://config-server:8888"
  application:
    name: ms-book
  cloud:
    config:
      enabled: true
      uri: http://config-server:8888
      fail-fast: false
  profiles:
    active: default
  
  # Fallback database configuration
  datasource:
    url: jdbc:postgresql://book-postgres:5432/book_db
    username: book_user
    password: book_pass
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  show-actuator: true

# Fallback configuration if config server is not available
server:
  port: 8082

logging:
  level:
    root: INFO

# Eureka client configuration
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/